# -----------------------------------------------------------------------------
# Gradle / Kotlin daemon tuning
# -----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.daemon.jvm.args=-Xmx2g
systemProp.kotlin.compiler.execution.strategy=in-process

# -----------------------------------------------------------------------------
# CoupleTracker custom build config
# -----------------------------------------------------------------------------
# 后端地址（Android 模拟器内访问宿主机，默认用 10.0.2.2 别名）
CUSTOM_API_BASE=http://10.0.2.2:3001
# 前端 WebView 页面地址（Vite 跑在宿主机 5173）
CUSTOM_WEB_BASE=http://10.0.2.2:5173
