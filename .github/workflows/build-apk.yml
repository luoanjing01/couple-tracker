name: Build CoupleTracker APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_USER_HOME: ~/.gradle
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+UseG1GC
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version (+0.001)
        id: version
        run: |
          # 从 build.gradle.kts 读取当前 versionCode，+1 得到新版本号
          # versionName 格式 0.xxx，+1 等于 +0.001
          CURRENT=$(grep 'versionCode = ' android-app/app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          NEXT=$((CURRENT + 1))
          NEXT_NAME="0.${NEXT}"
          echo "versionCode=${NEXT}" >> $GITHUB_OUTPUT
          echo "versionName=${NEXT_NAME}" >> $GITHUB_OUTPUT
          echo "[INFO] Current versionCode=${CURRENT} (0.${CURRENT})"
          echo "[INFO] Next versionCode=${NEXT} (${NEXT_NAME})"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        working-directory: android-app
        run: |
          set -e
          chmod +x ./gradlew
          echo "[INFO] gradlew version:"
          ./gradlew --version 2>&1 | head -15

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set -euo pipefail
          LOG=/tmp/build.log
          cp /dev/null "$LOG"
          if ! ./gradlew :app:assembleDebug --stacktrace --console=plain --no-build-cache \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }} \
            >"$LOG" 2>&1; then
            echo "[ERROR] gradlew assembleDebug FAILED" >&2
            echo "--- FULL BUILD LOG BEGIN ---" >&2
            cat "$LOG" >&2
            echo "--- FULL BUILD LOG END ---" >&2
            cp "$LOG" build.log
            exit 1
          fi
          echo "[SUCCESS] assembleDebug completed."
          cp "$LOG" build.log
          echo "[INFO] === APK output ==="
          find app/build -name "*.apk" -type f -printf "  APK: %p (%s bytes)\n" 2>/dev/null || true

      - name: List all APK outputs (debug)
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find android-app -name "*.apk" - type f -printf "FOUND: %p (%s bytes)\n" 2>/dev/null || true
          echo "=== Listing debug/ dir ==="
          ls -lR android-app/app/build/outputs/apk/ 2>/dev/null || echo "(apk output dir missing or empty)"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoupleTracker-debug-apk
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/**/app-debug.apk
            android-app/**/*.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.versionName }}
          name: CoupleTracker v${{ steps.version.outputs.versionName }}
          body: |
            ## v${{ steps.version.outputs.versionName }} 更新

            ### 安装方式
            下载下方 app-debug.apk，安装到手机即可
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false

      - name: Bump version in build.gradle.kts [skip ci]
        if: github.ref == 'refs/heads/main' && success()
        run: |
          # 把新版本号写回 build.gradle.kts，下次构建再 +1
          sed -i 's/versionCode = .*?: 177/versionCode = (project.properties["versionCode"] as? String)?.toInt() ?: ${{ steps.version.outputs.versionCode }}/' android-app/app/build.gradle.kts
          sed -i 's/versionName = .*?: "0.177"/versionName = project.properties["versionName"] as? String ?: "${{ steps.version.outputs.versionName }}"/' android-app/app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.version.outputs.versionName }} [skip ci]"
          git push

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-app/build.log
          if-no-files-found: ignore
          retention-days: 7
