name: Build CoupleTracker APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  GRADLE_USER_HOME: ~/.gradle
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+UseG1GC
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle 8.5 + Wrapper
        working-directory: android-app
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            echo "[INFO] No gradlew — downloading Gradle 8.5 to generate wrapper"
            curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            mkdir -p ~/.gradle-tools
            unzip -q /tmp/gradle.zip -d ~/.gradle-tools
            export PATH=~/.gradle-tools/gradle-8.5/bin:$PATH
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x ./gradlew
          fi
          echo "[INFO] gradlew version:"
          ./gradlew --version 2>&1 | head -15

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708  # commandlinetools-win-12
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set -euo pipefail
          LOG=/tmp/build.log
          rm -f "$LOG"
          if ! ./gradlew :app:assembleDebug --stacktrace --console=plain --no-build-cache >"$LOG" 2>&1; then
            echo "[ERROR] gradlew assembleDebug FAILED — dumping last 200 lines:" >&2
            tail -200 "$LOG" >&2
            echo "--- END FAIL LOG ---" >&2
            exit 1
          fi
          echo "[SUCCESS] assembleDebug completed."
          echo "[INFO] === last 30 lines of build log ==="
          tail -30 "$LOG" || true
          echo "[INFO] === APK output dir ==="
          find app/build -name "*.apk" -type f -printf "  APK: %p (%s bytes)\n" 2>/dev/null
          ls -lah app/build/outputs/apk/ 2>/dev/null || echo "(no apk output dir)"
          echo "[INFO] === app/build outputs tree (last 30) ==="
          find app/build -maxdepth 5 -type d 2>/dev/null | head -40

      - name: List all APK outputs (debug)
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find android-app -name "*.apk" -type f -printf "FOUND: %p (%s bytes)\n" 2>/dev/null || true
          echo "=== Listing debug/ dir ==="
          ls -lR android-app/app/build/outputs/apk/ 2>/dev/null || echo "(apk output dir missing or empty)"
          echo "=== workspace dir ==="
          ls -la "$GITHUB_WORKSPACE" | head -20

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoupleTracker-debug-apk
          # glob 匹配：主路径 + 回退路径，找不到就明确 error
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/**/app-debug.apk
            android-app/**/*.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload Build Reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android-app/app/build/reports/**/*.html
            android-app/app/build/reports/**/*.xml
            android-app/app/build/reports/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
