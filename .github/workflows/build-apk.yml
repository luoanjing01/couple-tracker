name: Build CoupleTracker APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  GRADLE_USER_HOME: ~/.gradle
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+UseG1GC
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle 8.5 + Wrapper
        working-directory: android-app
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            echo "[INFO] No gradlew — downloading Gradle 8.5 to generate wrapper"
            curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            mkdir -p ~/.gradle-tools
            unzip -q /tmp/gradle.zip -d ~/.gradle-tools
            export PATH=~/.gradle-tools/gradle-8.5/bin:$PATH
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x ./gradlew
          fi
          echo "[INFO] gradlew version:"
          ./gradlew --version 2>&1 | head -15

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708  # commandlinetools-win-12
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-build-cache 2>&1 | tail -80
          echo "[INFO] APK output:"
          ls -lah app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "[INFO] Mapping/reports:"
          ls app/build/reports/ 2>/dev/null || echo "(no reports)"

      - name: Collect build outputs
        if: always()
        id: outputs
        run: |
          DEBUG_APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_APK" ]; then
            SIZE=$(du -h "$DEBUG_APK" | cut -f1)
            echo "debug_apk_exists=true" >> $GITHUB_OUTPUT
            echo "debug_apk_size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "debug_apk_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK artifact
        if: steps.outputs.outputs.debug_apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CoupleTracker-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload Build Reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android-app/app/build/reports/**/*.html
            android-app/app/build/reports/**/*.xml
            android-app/app/build/reports/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
