name: Build CoupleTracker APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_USER_HOME: ~/.gradle
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+UseG1GC
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        working-directory: android-app
        run: |
          set -e
          chmod +x ./gradlew
          echo "[INFO] gradlew version:"
          ./gradlew --version 2>&1 | head -15

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set -euo pipefail
          LOG=/tmp/build.log
          cp /dev/null "$LOG"
          if ! ./gradlew :app:assembleDebug --stacktrace --console=plain --no-build-cache >"$LOG" 2>&1; then
            echo "[ERROR] gradlew assembleDebug FAILED" >&2
            echo "--- FULL BUILD LOG BEGIN ---" >&2
            cat "$LOG" >&2
            echo "--- FULL BUILD LOG END ---" >&2
            cp "$LOG" build.log
            exit 1
          fi
          echo "[SUCCESS] assembleDebug completed."
          cp "$LOG" build.log
          echo "[INFO] === APK output ==="
          find app/build -name "*.apk" -type f -printf "  APK: %p (%s bytes)\n" 2>/dev/null || true

      - name: List all APK outputs (debug)
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find android-app -name "*.apk" -type f -printf "FOUND: %p (%s bytes)\n" 2>/dev/null || true
          echo "=== Listing debug/ dir ==="
          ls -lR android-app/app/build/outputs/apk/ 2>/dev/null || echo "(apk output dir missing or empty)"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoupleTracker-debug-apk
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/**/app-debug.apk
            android-app/**/*.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.177
          name: CoupleTracker v0.177
          body: |
            ## v0.177 更新内容

            ### 取消配对功能修复
            - 取消配对改用 REST API PATCH profiles 表（不依赖 SQL 函数部署）
            - 拒绝配对改用 REST API PATCH 清对方 pending_pair
            - NetworkModule serializeNulls 支持 PATCH 清空字段
            - 取消配对按钮加 Toast 反馈 + 防抖

            ### 应用/统计切换
            - AppScreen 和 StatsScreen 已有完整「我/TA」切换按钮
            - partnerId 同步后自动生效

            ### 安装方式
            下载下方 app-debug.apk，安装到手机即可
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-app/build.log
          if-no-files-found: ignore
          retention-days: 7
